<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1014"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <g opacity="0.15" stroke="#35B8C5" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Title -->
  <text x="40" y="48" fill="#35B8C5" font-family="monospace" font-size="12" letter-spacing="2">COMPUTEPULSE · PREDICTIVE GPU CLUSTER RISK INTELLIGENCE</text>
  <rect x="590" y="32" width="170" height="24" rx="4" fill="#18242F" stroke="#2B3D4C"/>
  <text x="600" y="48" fill="#35B8C5" font-family="monospace" font-size="11">ROLE: TEAM LEAD (ML/API)</text>

  <!-- Left: Node Matrix -->
  <rect x="40" y="80" width="440" height="330" rx="8" fill="#141E27" stroke="#26323B"/>
  <text x="60" y="108" fill="#E8EEF2" font-family="sans-serif" font-weight="600" font-size="14">16-Node Cluster Telemetry &amp; Anomaly Matrix</text>
  <text x="60" y="128" fill="#95A3AE" font-family="monospace" font-size="11">Stream rate: 500 events/sec · NVLink/PCIe/VRAM Sensors</text>

  <!-- 16 Nodes Grid (4x4) -->
  <g transform="translate(60, 145)">
