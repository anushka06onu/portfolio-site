    <rect x="0" y="0" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="10" y="20" fill="#E8EEF2" font-family="monospace" font-size="11">Node-01</text>
    <text x="10" y="40" fill="#35B8C5" font-family="sans-serif" font-size="10">98% Normal</text>

    <rect x="95" y="0" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="105" y="20" fill="#E8EEF2" font-family="monospace" font-size="11">Node-02</text>
    <text x="105" y="40" fill="#35B8C5" font-family="sans-serif" font-size="10">95% Normal</text>

    <rect x="190" y="0" width="85" height="55" rx="4" fill="#2C1D1D" stroke="#E57373" stroke-width="1.5"/>
    <text x="200" y="20" fill="#E8EEF2" font-family="monospace" font-size="11">Node-03</text>
    <text x="200" y="40" fill="#E57373" font-family="sans-serif" font-weight="bold" font-size="10">⚠️ Risk 84%</text>

    <rect x="285" y="0" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="295" y="20" fill="#E8EEF2" font-family="monospace" font-size="11">Node-04</text>
    <text x="295" y="40" fill="#35B8C5" font-family="sans-serif" font-size="10">99% Normal</text>

    <!-- Row 2 -->
    <rect x="0" y="65" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="10" y="85" fill="#E8EEF2" font-family="monospace" font-size="11">Node-05</text>
    <text x="10" y="105" fill="#35B8C5" font-family="sans-serif" font-size="10">94% Normal</text>

    <rect x="95" y="65" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="105" y="85" fill="#E8EEF2" font-family="monospace" font-size="11">Node-06</text>
    <text x="105" y="105" fill="#35B8C5" font-family="sans-serif" font-size="10">96% Normal</text>

    <rect x="190" y="65" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="200" y="85" fill="#E8EEF2" font-family="monospace" font-size="11">Node-07</text>
    <text x="200" y="105" fill="#35B8C5" font-family="sans-serif" font-size="10">91% Normal</text>

    <rect x="285" y="65" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="295" y="85" fill="#E8EEF2" font-family="monospace" font-size="11">Node-08</text>
    <text x="295" y="105" fill="#35B8C5" font-family="sans-serif" font-size="10">97% Normal</text>

    <!-- Row 3 -->
    <rect x="0" y="130" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="10" y="150" fill="#E8EEF2" font-family="monospace" font-size="11">Node-09</text>
    <text x="10" y="170" fill="#35B8C5" font-family="sans-serif" font-size="10">99% Normal</text>

    <rect x="95" y="130" width="85" height="55" rx="4" fill="#2E2818" stroke="#F6AD55"/>
    <text x="105" y="150" fill="#E8EEF2" font-family="monospace" font-size="11">Node-10</text>
    <text x="105" y="170" fill="#F6AD55" font-family="sans-serif" font-size="10">⚡ Elev 62%</text>

    <rect x="190" y="130" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="200" y="150" fill="#E8EEF2" font-family="monospace" font-size="11">Node-11</text>
    <text x="200" y="170" fill="#35B8C5" font-family="sans-serif" font-size="10">96% Normal</text>

    <rect x="285" y="130" width="85" height="55" rx="4" fill="#18242F" stroke="#35B8C5"/>
    <text x="295" y="150" fill="#E8EEF2" font-family="monospace" font-size="11">Node-12</text>
    <text x="295" y="170" fill="#35B8C5" font-family="sans-serif" font-size="10">98% Normal</text>

    <!-- Legend -->
    <g transform="translate(0, 205)">
      <circle cx="10" cy="10" r="5" fill="#35B8C5"/>
