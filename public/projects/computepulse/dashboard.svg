  <!-- Right: Root-Cause Explainability Panel -->
  <rect x="500" y="80" width="260" height="330" rx="8" fill="#141E27" stroke="#26323B"/>
  <text x="520" y="108" fill="#E8EEF2" font-family="sans-serif" font-weight="600" font-size="14">SHAP Root-Cause Attribution</text>
  <text x="520" y="128" fill="#E57373" font-family="monospace" font-size="11">Target: Node-03 Critical Alert</text>

  <g transform="translate(520, 150)">
    <text x="0" y="12" fill="#E8EEF2" font-family="sans-serif" font-size="11">Thermal Junction Rise</text>
    <rect x="0" y="20" width="180" height="8" rx="2" fill="#E57373"/>
    <text x="190" y="28" fill="#E57373" font-family="monospace" font-size="10">+0.48</text>

    <text x="0" y="52" fill="#E8EEF2" font-family="sans-serif" font-size="11">VRAM Memory Thrash</text>
    <rect x="0" y="60" width="140" height="8" rx="2" fill="#E57373"/>
    <text x="150" y="68" fill="#E57373" font-family="monospace" font-size="10">+0.32</text>

    <text x="0" y="92" fill="#E8EEF2" font-family="sans-serif" font-size="11">Fan Speed PWM Stutter</text>
    <rect x="0" y="100" width="90" height="8" rx="2" fill="#F6AD55"/>
    <text x="100" y="108" fill="#F6AD55" font-family="monospace" font-size="10">+0.19</text>

    <text x="0" y="132" fill="#E8EEF2" font-family="sans-serif" font-size="11">PCIe Bus Bandwidth Saturation</text>
    <rect x="0" y="140" width="40" height="8" rx="2" fill="#79A7E8"/>
    <text x="50" y="148" fill="#79A7E8" font-family="monospace" font-size="10">+0.07</text>

    <!-- Suggested Action Box -->
    <rect x="0" y="170" width="220" height="70" rx="6" fill="#18242F" stroke="#2B3D4C"/>
    <text x="10" y="190" fill="#35B8C5" font-family="monospace" font-size="10">RECOMMENDED ACTION</text>
    <text x="10" y="210" fill="#E8EEF2" font-family="sans-serif" font-size="11">Migrate rank-0 workers from Node-03 to Node-01 before throttle event.</text>
  </g>
</svg>
