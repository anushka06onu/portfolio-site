      <circle cx="140" cy="10" r="5" fill="#F6AD55"/>
      <text x="155" y="14" fill="#95A3AE" font-family="sans-serif" font-size="11">Elevated (30-70%)</text>
      <circle cx="280" cy="10" r="5" fill="#E57373"/>
      <text x="295" y="14" fill="#95A3AE" font-family="sans-serif" font-size="11">Critical (&gt;70%)</text>
