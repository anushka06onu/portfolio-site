<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1014"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087F8C"/>
      <stop offset="100%" stop-color="#35B8C5"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#345995"/>
      <stop offset="100%" stop-color="#79A7E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.15" stroke="#35B8C5" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Header -->
  <text x="40" y="48" fill="#35B8C5" font-family="monospace" font-size="12" letter-spacing="2">RESILINET · SDN DIGITAL TWIN &amp; PREDICTIVE ROUTING PIPELINE</text>
  
  <!-- Provenance Badge -->
  <rect x="580" y="32" width="180" height="24" rx="4" fill="#18242F" stroke="#2B3D4C"/>
  <text x="590" y="48" fill="#79A7E8" font-family="monospace" font-size="11">SHA-256 PROVENANCE: 8f4e..c1</text>

  <!-- Box 1: Data Plane Emulation -->
  <rect x="40" y="85" width="210" height="150" rx="8" fill="#141E27" stroke="#26323B" stroke-width="1.5"/>
  <text x="55" y="112" fill="#E8EEF2" font-family="sans-serif" font-weight="600" font-size="14">Mininet SDN Plane</text>
  <text x="55" y="132" fill="#95A3AE" font-family="monospace" font-size="11">OpenFlow v1.3 Switches</text>
  <circle cx="75" cy="175" r="14" fill="#18242F" stroke="#35B8C5" stroke-width="2"/>
  <text x="70" y="180" fill="#35B8C5" font-family="monospace" font-size="11">S1</text>
  <circle cx="145" cy="160" r="14" fill="#18242F" stroke="#35B8C5" stroke-width="2"/>
  <text x="140" y="165" fill="#35B8C5" font-family="monospace" font-size="11">S2</text>
  <circle cx="215" cy="185" r="14" fill="#18242F" stroke="#35B8C5" stroke-width="2"/>
  <text x="210" y="190" fill="#35B8C5" font-family="monospace" font-size="11">S3</text>
  <line x1="89" y1="172" x2="131" y2="163" stroke="#35B8C5" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="159" y1="165" x2="201" y2="180" stroke="#35B8C5" stroke-width="2"/>
  <text x="55" y="220" fill="#5C6975" font-family="sans-serif" font-size="10">Real-time Port Telemetry (Deltas/Queues)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="250" y1="160" x2="295" y2="160" stroke="#79A7E8" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="295,160 287,155 287,165" fill="#79A7E8"/>

  <!-- Box 2: Predictive Engine & SHAP -->
  <rect x="295" y="85" width="220" height="150" rx="8" fill="#141E27" stroke="#087F8C" stroke-width="2"/>
  <text x="310" y="112" fill="#E8EEF2" font-family="sans-serif" font-weight="600" font-size="14">LightGBM + TreeSHAP</text>
  <text x="310" y="132" fill="#35B8C5" font-family="monospace" font-size="11">Congestion Forecasting &lt;5ms</text>
  
  <!-- SHAP Bars -->
  <g transform="translate(310, 150)">
    <text x="0" y="10" fill="#95A3AE" font-family="monospace" font-size="10">tx_bytes_sec</text>
    <rect x="80" y="0" width="70" height="12" fill="#35B8C5" rx="2"/>
    <text x="155" y="10" fill="#35B8C5" font-family="monospace" font-size="9">+0.42</text>
    
    <text x="0" y="30" fill="#95A3AE" font-family="monospace" font-size="10">queue_depth</text>
    <rect x="80" y="20" width="50" height="12" fill="#35B8C5" rx="2"/>
    <text x="135" y="30" fill="#35B8C5" font-family="monospace" font-size="9">+0.31</text>

    <text x="0" y="50" fill="#95A3AE" font-family="monospace" font-size="10">burst_history</text>
    <rect x="80" y="40" width="25" height="12" fill="#79A7E8" rx="2"/>
    <text x="110" y="50" fill="#79A7E8" font-family="monospace" font-size="9">+0.14</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="515" y1="160" x2="560" y2="160" stroke="#79A7E8" stroke-width="2"/>
  <polygon points="560,160 552,155 552,165" fill="#79A7E8"/>

  <!-- Box 3: Policy-Aware Controller -->
  <rect x="560" y="85" width="200" height="150" rx="8" fill="#141E27" stroke="#26323B" stroke-width="1.5"/>
  <text x="575" y="112" fill="#E8EEF2" font-family="sans-serif" font-weight="600" font-size="14">Ryu SDN Controller</text>
  <text x="575" y="132" fill="#95A3AE" font-family="monospace" font-size="11">Policy &amp; Fallback Router</text>
  <rect x="575" y="150" width="170" height="26" rx="4" fill="#18242F" stroke="#35B8C5"/>
  <text x="585" y="167" fill="#35B8C5" font-family="sans-serif" font-size="11">✓ Predictive Dynamic Path</text>
  <rect x="575" y="185" width="170" height="26" rx="4" fill="#111820" stroke="#26323B"/>
  <text x="585" y="202" fill="#95A3AE" font-family="sans-serif" font-size="11">⚡ Dijkstra Fallback (Safety)</text>

  <!-- Bottom Verification Panel -->
  <rect x="40" y="260" width="720" height="150" rx="8" fill="#111820" stroke="#26323B"/>
  <text x="60" y="290" fill="#E8EEF2" font-family="sans-serif" font-weight="600" font-size="13">Automated Verification &amp; Scenario Evaluation Suite</text>
  
  <g transform="translate(60, 310)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#18242F" stroke="#2B3D4C"/>
    <text x="15" y="25" fill="#35B8C5" font-family="monospace" font-weight="bold" font-size="18">61 Tests</text>
    <text x="15" y="45" fill="#95A3AE" font-family="sans-serif" font-size="11">Backend Unit / API</text>
    <text x="15" y="60" fill="#5C6975" font-family="monospace" font-size="10">Pytest passing</text>

    <!-- Chip 2 -->
    <rect x="175" y="0" width="150" height="70" rx="6" fill="#18242F" stroke="#2B3D4C"/>
    <text x="190" y="25" fill="#79A7E8" font-family="monospace" font-weight="bold" font-size="18">11 Tests</text>
    <text x="190" y="45" fill="#95A3AE" font-family="sans-serif" font-size="11">Frontend UI / State</text>
    <text x="190" y="60" fill="#5C6975" font-family="monospace" font-size="10">Vitest passing</text>

    <!-- Chip 3 -->
    <rect x="350" y="0" width="160" height="70" rx="6" fill="#18242F" stroke="#2B3D4C"/>
    <text x="365" y="25" fill="#E8EEF2" font-family="monospace" font-weight="bold" font-size="18">4 Scenarios</text>
    <text x="365" y="45" fill="#95A3AE" font-family="sans-serif" font-size="11">Traffic Injections</text>
    <text x="365" y="60" fill="#5C6975" font-family="monospace" font-size="10">Flash, Spike, Degrade</text>

    <!-- Chip 4 -->
    <rect x="535" y="0" width="150" height="70" rx="6" fill="#18242F" stroke="#2B3D4C"/>
    <text x="550" y="25" fill="#35B8C5" font-family="monospace" font-weight="bold" font-size="18">&lt; 8ms</text>
    <text x="550" y="45" fill="#95A3AE" font-family="sans-serif" font-size="11">Inference Latency</text>
    <text x="550" y="60" fill="#5C6975" font-family="monospace" font-size="10">LightGBM inference</text>
  </g>
</svg>
