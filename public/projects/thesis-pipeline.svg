<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1017"/>
      <stop offset="100%" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect width="998" height="478" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#172333" stroke-width="0.75" stroke-dasharray="4 4">
    <line x1="60" y1="40" x2="60" y2="440" />
    <line x1="280" y1="40" x2="280" y2="440" />
    <line x1="510" y1="40" x2="510" y2="440" />
    <line x1="740" y1="40" x2="740" y2="440" />
    <line x1="940" y1="40" x2="940" y2="440" />
    <line x1="40" y1="240" x2="960" y2="240" />
  </g>

  <!-- Header Annotation -->
  <text x="50" y="55" fill="#38BDF8" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">VFM ADAPTATION ARCHITECTURE · UNDERGRADUATE THESIS</text>
  <text x="50" y="78" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="14">DentIRO Benchmark &amp; Parameter-Efficient Fine-Tuning Pipeline</text>

  <!-- Stage 1: Input Radiograph -->
  <g transform="translate(50, 110)">
    <rect width="180" height="280" rx="12" fill="#0E1622" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="160" height="150" x="10" y="10" rx="8" fill="#131E2C"/>
    
    <!-- Simulated Panoramic Radiograph graphic -->
    <path d="M 25 80 Q 90 40 155 80 Q 90 140 25 80 Z" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <ellipse cx="90" cy="85" rx="45" ry="30" fill="#2DD4BF" opacity="0.15"/>
    <circle cx="70" cy="80" r="6" fill="#F87171" opacity="0.8"/>
    <circle cx="110" cy="90" r="5" fill="#F87171" opacity="0.8"/>
    <text x="75" y="72" fill="#F87171" font-family="monospace" font-size="10">caries</text>
    
    <text x="20" y="190" fill="#F1F5F9" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">1. Dental Radiographs</text>
    <text x="20" y="215" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">DentIRO Dataset</text>
    <text x="20" y="235" fill="#64748B" font-family="monospace" font-size="11">10% — 50% Low-Data</text>
    <text x="20" y="255" fill="#64748B" font-family="monospace" font-size="11">Multi-Class Pathologies</text>
  </g>

  <!-- Flow Connector 1 -->
  <g transform="translate(230, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="40,-4 48,0 40,4" fill="#2DD4BF"/>
  </g>

  <!-- Stage 2: Frozen Vision Foundation Models -->
  <g transform="translate(280, 110)">
    <rect width="200" height="280" rx="12" fill="#0E1622" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect width="180" height="42" x="10" y="15" rx="6" fill="#13232E" stroke="#0D9488" stroke-width="1"/>
    <text x="25" y="41" fill="#2DD4BF" font-family="monospace" font-size="13" font-weight="700">DINOv2 (ViT-B/14)</text>
    
    <rect width="180" height="42" x="10" y="68" rx="6" fill="#13232E" stroke="#0D9488" stroke-width="1"/>
    <text x="25" y="94" fill="#2DD4BF" font-family="monospace" font-size="13" font-weight="700">BiomedCLIP (ViT-B)</text>

    <rect width="180" height="42" x="10" y="121" rx="6" fill="#13232E" stroke="#0D9488" stroke-width="1"/>
    <text x="25" y="147" fill="#2DD4BF" font-family="monospace" font-size="13" font-weight="700">MedSAM Encoder</text>

    <text x="20" y="200" fill="#F1F5F9" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">2. Frozen VFM Encoders</text>
    <text x="20" y="225" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Linear Probing Baseline</text>
    <text x="20" y="245" fill="#64748B" font-family="monospace" font-size="11">Frozen Pretrained Weights</text>
    <text x="20" y="265" fill="#2DD4BF" font-family="monospace" font-size="11">Embedding Representation</text>
  </g>

  <!-- Flow Connector 2 -->
  <g transform="translate(480, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="40,-4 48,0 40,4" fill="#38BDF8"/>
  </g>

  <!-- Stage 3: Parameter-Efficient Fine-Tuning (PEFT) -->
  <g transform="translate(520, 110)">
    <rect width="200" height="280" rx="12" fill="#0E1622" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect width="180" height="42" x="10" y="15" rx="6" fill="#142136" stroke="#2563EB" stroke-width="1"/>
    <text x="25" y="41" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">LoRA (Rank r=8/16)</text>
    
    <rect width="180" height="42" x="10" y="68" rx="6" fill="#142136" stroke="#2563EB" stroke-width="1"/>
    <text x="25" y="94" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">BitFit (Bias-Only)</text>

    <rect width="180" height="42" x="10" y="121" rx="6" fill="#142136" stroke="#2563EB" stroke-width="1"/>
    <text x="25" y="147" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">Visual Prompt Tuning</text>

    <text x="20" y="200" fill="#F1F5F9" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">3. PEFT Adaptation</text>
    <text x="20" y="225" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">vs. Full Fine-Tuning (FFT)</text>
    <text x="20" y="245" fill="#64748B" font-family="monospace" font-size="11">&lt; 2% Trainable Params</text>
    <text x="20" y="265" fill="#38BDF8" font-family="monospace" font-size="11">Layer-Depth Ablations</text>
  </g>

  <!-- Flow Connector 3 -->
  <g transform="translate(720, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="40,-4 48,0 40,4" fill="#F59E0B"/>
  </g>

  <!-- Stage 4: Evaluation & Explainability -->
  <g transform="translate(760, 110)">
    <rect width="190" height="280" rx="12" fill="#0E1622" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="170" height="85" x="10" y="15" rx="6" fill="#1B1713" stroke="#D97706" stroke-width="1"/>
    
    <!-- Heatmap graphic -->
    <rect x="25" y="28" width="140" height="40" rx="4" fill="#0B131E"/>
    <circle cx="65" cy="48" r="14" fill="#EF4444" opacity="0.6" filter="url(#glow)"/>
    <circle cx="65" cy="48" r="7" fill="#FDE047" opacity="0.9"/>
    <text x="90" y="45" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="700">Grad-CAM</text>
    <text x="90" y="58" fill="#94A3B8" font-family="monospace" font-size="9">Attribution</text>

    <text x="20" y="130" fill="#F1F5F9" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">4. Diagnosis &amp; XAI</text>
    <text x="20" y="155" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Multi-Class Metrics</text>
    <text x="20" y="180" fill="#64748B" font-family="monospace" font-size="11">Macro F1 &amp; AUC-ROC</text>
    <text x="20" y="200" fill="#64748B" font-family="monospace" font-size="11">Caries &amp; Bone Loss</text>
    <text x="20" y="220" fill="#F59E0B" font-family="monospace" font-size="11">Clinical Alignment</text>
    <text x="20" y="250" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">✓ Robust Low-Data</text>
  </g>

  <!-- Bottom Caption -->
  <text x="500" y="440" text-anchor="middle" fill="#64748B" font-family="-apple-system, system-ui, sans-serif" font-size="12">
    Undergraduate Thesis Research · Department of Computer Science &amp; Engineering · Daffodil International University
  </text>
</svg>
